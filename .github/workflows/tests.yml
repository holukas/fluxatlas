# The test suite and the documentation build, on both supported Python versions.
#
# `uv sync --locked` fails rather than resolving, so a lockfile that has drifted from
# `pyproject.toml` is caught here instead of in a release. The documentation is built with `-W`,
# which is what Read the Docs does, so a broken cross-reference fails a pull request rather than a
# hosted build.

name: tests

on:
  push:
    branches: [main, indev]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --extra docs

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/js/package-lock.json

      - name: Install jsdom
        # The renderer smoke test executes the built page rather than only parsing it, which needs
        # a DOM. jsdom is a node package and deliberately not a dependency of fluxatlas, so it is
        # installed here alone; without it the smoke tests skip and the renderer goes unexercised.
        run: npm ci
        working-directory: tests/js

      - name: Run the tests
        # Node and jsdom are both present, so the renderer is parsed *and* run here rather than
        # skipped. This is the only place either happens automatically.
        run: uv run pytest

      - name: Build the documentation
        # `-j auto` matches what Read the Docs runs, and matters more than it looks: parallel
        # reading is unavailable anywhere without `os.fork`, so a Windows checkout builds serially
        # whatever it is asked for and cannot see a parallel-only failure. This job can.
        run: uv run sphinx-build -b html -W -j auto docs docs/_build/html

      - name: Build the distribution
        run: uv build

      - name: Check the wheel carries the page assets
        # A wheel without these installs cleanly and then writes a page with no styles, no
        # renderer and no mark.
        run: |
          uv run python - <<'PY'
          import glob, zipfile
          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(wheel).namelist()
          wanted = ["template.html", "base.css", "calendar.css", "calendar.js", "logo.svg"]
          missing = [n for n in wanted if f"fluxatlas/assets/{n}" not in names]
          if missing:
              raise SystemExit(f"{wheel} is missing {', '.join(missing)}")
          print(f"{wheel} carries all {len(wanted)} assets")
          PY
