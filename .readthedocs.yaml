# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    # The lower bound of `requires-python`. Nothing in the docs build needs more.
    python: "3.12"

python:
  install:
    # The package and its `docs` extra, in one install. The package has to be importable:
    # `autodoc` reads its docstrings, and the variable tables are generated from the registry
    # rather than written out.
    #
    # An extra rather than a PEP 735 dependency group, because a group is not reachable from a
    # path install, which is how a project is installed here. `pyproject.toml` stays the one place
    # the documentation dependencies are stated, which is the property worth keeping.
    - method: pip
      path: .
      extra_requirements:
        - docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

# HTML only. A PDF is a LaTeX build, and the units on these pages are heavy in characters
# (`W m⁻²`, `µmol`, `°C`) that need xelatex and a font that carries them; `conf.py` sets the
# engine, so adding `- pdf` here is what remains if a PDF is ever wanted.
formats: []
