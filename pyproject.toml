[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fluxatlas"
version = "0.1.0"
description = "Standalone HTML explorer for eddy covariance records: fluxes, meteorology, badges, trends, day by day"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "GPL-3.0" }
authors = [{ name = "Lukas Hörtnagl", email = "holukas@ethz.ch" }]

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    # Theil-Sen slopes and Kendall's tau, the estimators behind every trend the page publishes.
    "scipy>=1.11",
    # Reading .parquet input; FLUXNET files are usually .csv, but the upstream CH-LAE products the
    # first atlases were built from are parquet.
    "pyarrow>=15.0",
]

[project.scripts]
fluxatlas = "fluxatlas.cli:main"

[project.urls]
Homepage = "https://github.com/holukas/fluxatlas"
Repository = "https://github.com/holukas/fluxatlas"
Documentation = "https://fluxatlas.readthedocs.io"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
# The documentation build, and the one place its dependencies are stated: Read the Docs installs
# this group with `uv sync`, so a version pinned here is the version the hosted build uses.
docs = [
    "sphinx>=8.1",
    "furo>=2024.8.6",
    "myst-parser>=4.0",
    "sphinx-autodoc-typehints>=2.5",
    # The CLI reference is generated from `fluxatlas.cli.build_parser` rather than copied.
    "sphinx-argparse>=0.5",
    "sphinx-copybutton>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests/` is not a package, and conftest.py exports the synthetic-data builders that several
# test modules import by name.
pythonpath = ["tests"]
addopts = "-q"
